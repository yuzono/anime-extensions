name: CI

on:
  push:
    branches:
      - master
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '.github/scripts/**'
      - '.github/workflows/build_push.yml'
  # Manual trigger
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: Rebuild and republish every extension instead of only what changed since the last successful run
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_CHUNK_SIZE: 15
  IS_PR_CHECK: false

jobs:
  prepare:
    permissions:
      contents: write
      actions: read
    name: Prepare job
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      latestCommitMessage: ${{ steps.set-env.outputs.LATEST_COMMIT_MESSAGE }}
      matrix: ${{ steps.generate-matrices.outputs.matrix }}
      delete: ${{ steps.generate-matrices.outputs.delete }}
      skipBump: ${{ steps.set-env.outputs.SKIP_BUMP }}
      full_rebuild: ${{ steps.base.outputs.full_rebuild || steps.generate-matrices.outputs.full_rebuild }}
    steps:
      - name: Checkout ${{ github.ref_name }} branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set env
        id: set-env
        env:
          HEAD_SHA: ${{ github.sha }}
          FULL_REBUILD: ${{ inputs.full_rebuild }}
        run: |
          LATEST_COMMIT_MESSAGE=$(git log -1 --pretty=%B "$HEAD_SHA")
          echo "LATEST_COMMIT_MESSAGE<<{delimiter}
          $LATEST_COMMIT_MESSAGE

          Built on commit: $HEAD_SHA
          {delimiter}" >> $GITHUB_OUTPUT

          # Commit message markers:
          #   [skip bumping version] -> skip the version bumping step only
          #   [skip yuzono ci]       -> skip the version bumping step and emit empty
          #                             build matrices, so the build job does not run
          skip_bump=false
          skip_build=false
          case "$LATEST_COMMIT_MESSAGE" in
            "[skip yuzono ci]"*)
              skip_bump=true
              skip_build=true
              ;;
            "[skip bumping version]"*)
              skip_bump=true
              ;;
          esac
          # A manual full rebuild is an explicit request to build, so it overrides the build skip
          if [ "$FULL_REBUILD" = "true" ]; then
            skip_build=false
          fi
          echo "SKIP_BUMP=$skip_bump" >> $GITHUB_OUTPUT
          echo "SKIP_BUILD=$skip_build" >> $GITHUB_OUTPUT
          echo "Commit $HEAD_SHA -> SKIP_BUMP=$skip_bump SKIP_BUILD=$skip_build"

      - name: Find lib changes
        id: modified-libs
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: lib/
          files_ignore: lib/**.md
          files_separator: " "
          safe_output: false

        # This step is going to commit, but this will not trigger another workflow.
        # If any changes to lib/ caused on master branch, bump the extensions that uses the modified lib.
        # If any changes caused by the merge commit, skip this step because versions should already pumped with that merge.
        # But that should be avoided because our own extensions may not be bumped.
      - name: Bump extensions that use a modified lib
        if: steps.modified-libs.outputs.any_changed == 'true' && steps.set-env.outputs.SKIP_BUMP != 'true' && github.repository == 'yuzono/anime-extensions'
        env:
          COMMIT_MESSAGE: ${{ steps.set-env.outputs.LATEST_COMMIT_MESSAGE }}
        run: |
          latest_commit_author=$(git log -1 --pretty=%an)
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          chmod +x ./.github/scripts/bump-versions.py
          ./.github/scripts/bump-versions.py "$COMMIT_MESSAGE" ${{ steps.modified-libs.outputs.all_changed_files }}
          git push

      - id: base
        name: Get last successful CI commit
        # A skipped build has no base, and must not report a full rebuild: publish would then replace the index with nothing
        if: steps.set-env.outputs.SKIP_BUILD != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_REBUILD: ${{ inputs.full_rebuild }}
        run: |
          # Empty tree: every module is diffed as new, so everything gets rebuilt
          empty_tree=$(git hash-object -t tree /dev/null)
          if [ "$FULL_REBUILD" = "true" ]; then
            sha=$empty_tree
          else
            sha=$(python ./.github/scripts/find-base-sha.py build_push.yml)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" = "$empty_tree" ]; then
            echo "full_rebuild=true" >> "$GITHUB_OUTPUT"
          fi

      - id: generate-matrices
        name: Create output matrices
        env:
          SKIP_BUILD: ${{ steps.set-env.outputs.SKIP_BUILD }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          if [ "$SKIP_BUILD" = "true" ]; then
            echo "Skipping build: emitting empty matrices."
            echo 'matrix={"chunk":[]}' >> $GITHUB_OUTPUT
            echo 'delete=[]' >> $GITHUB_OUTPUT
          else
            python ./.github/scripts/generate-build-matrices.py "$BASE_SHA" Release
          fi

  build:
    name: Build extensions (${{ matrix.chunk.number }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ toJson(fromJson(needs.prepare.outputs.matrix).chunk) != '[]' }}
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout ${{ github.ref_name }} branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ matrix.chunk.number > 1 }}

      - name: Prepare signing key
        run: |
          echo ${{ secrets.SIGNING_KEY }} | base64 -d > signingkey.jks
          chmod 600 signingkey.jks

      - name: Build extensions (${{ matrix.chunk.number }})
        env:
          MODULES: ${{ join(matrix.chunk.modules, ' ') }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MEGACLOUD_API: ${{ secrets.MEGACLOUD_API }}
          KISSKH_API: ${{ secrets.KISSKH_API }}
          KISSKH_SUB_API: ${{ secrets.KISSKH_SUB_API }}
          KAISVA: ${{ secrets.KAISVA }}
          TMDB_API: ${{ secrets.TMDB_API }}
          WYZIE_API: ${{ secrets.WYZIE_API }}
        run: |
          ./gradlew $MODULES

      - name: Upload APKs (${{ matrix.chunk.number }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.repository == 'yuzono/anime-extensions'
        with:
          name: "individual-apks-${{ matrix.chunk.number }}"
          path: |
            **/*.apk
            **/build/keiyoushi-source-info.json
          retention-days: 1

      - name: Clean up CI files
        run: rm signingkey.jks

  publish:
    name: Publish extension repo
    needs: [prepare, build]
    if: >-
      !cancelled()
      && needs.prepare.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && github.repository == 'yuzono/anime-extensions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo branch
        id: checkout-repo
        background: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yuzono/aniyomi-repo
          token: ${{ secrets.BOT_PAT }}
          ref: repo
          path: repo
          fetch-depth: 0
          persist-credentials: true

      - parallel:
          - name: Download APK artifacts
            uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
            with:
              path: ~/apk-artifacts

          - name: Checkout ${{ github.ref_name }} branch
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              ref: ${{ github.ref_name }}
              path: ${{ github.ref_name }}
              fetch-depth: 0
              persist-credentials: false

      - name: Wait for repo checkout
        wait: checkout-repo

      - name: Publish repo
        env:
          DELETE: ${{ needs.prepare.outputs.delete }}
          FULL_REBUILD: ${{ needs.prepare.outputs.full_rebuild }}
        run: |
          cd repo
          pip install "protobuf>=7.35.1,<8"
          python ../${{ github.ref_name }}/.github/scripts/publish-repo.py "$DELETE" "$FULL_REBUILD"

      - name: Deploy repo
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          message: "${{ needs.prepare.outputs.latestCommitMessage }}"
          cwd: "./repo"
          # committer_name: github-actions[bot]
          # committer_email: github-actions[bot]@users.noreply.github.com
