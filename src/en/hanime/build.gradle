ext {
    extName = 'hanime.tv'
    extClass = '.Hanime'
    extVersionCode = 23
    isNsfw = true
}

apply plugin: "kei.plugins.extension.legacy"

android {
    // Chicory WASM runtime uses MethodHandle.invoke/invokeExact which requires API 26+;
    // D8 cannot desugar these bytecode patterns. Override the project-wide minSdk (21).
    defaultConfig {
        minSdk = 26
    }
}

// Unit tests live outside `src/` because the legacy plugin makes the
// module-root `src` directory the MAIN source root.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.unitTest?.sources?.java?.addStaticSourceDirectory(file("test").absolutePath)
    }
}

dependencies {
    implementation(project(":lib:playlistutils"))
    //noinspection UseTomlInstead
    implementation("com.dylibso.chicory:runtime:1.7.5")
    // kotlin.stdlib.default.dependency=false repo-wide; unit tests need it declared explicitly
    testImplementation("org.jetbrains.kotlin:kotlin-stdlib:${libs.versions.kotlin.gradle.get()}")
    testImplementation("junit:junit:4.13.2")
    // bundles.common is compileOnly, so source supertypes are missing from the unit-test runtime
    testRuntimeOnly("com.github.komikku-app:aniyomi-extensions-lib:bdc8184127")
}
